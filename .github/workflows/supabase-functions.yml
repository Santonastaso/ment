name: supabase-functions

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check deployment credentials
        id: credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF are required to deploy Edge Functions."
            exit 1
          fi

      - name: Deploy Edge Functions
        if: steps.credentials.outputs.can_deploy == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          # Keep this list in step with package.json deploy:functions. Five
          # functions used to be missing here, so a change to any of them was
          # committed but never reached production.
          supabase functions deploy \
            admin-create-user admin-reset-password admin-create-invitation accept-invitation \
            discovery-assistant profile-ingest reflection-classify public-signup \
            send-notification-outbox calendar-provider request-access complete-password-change \
            --project-ref "$SUPABASE_PROJECT_REF"
