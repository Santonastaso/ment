name: discovery-eval

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discovery-eval
  cancel-in-progress: false

jobs:
  eval:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging-eval
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run staging eval
        env:
          SUPABASE_EVAL_ACCESS_TOKEN: ${{ secrets.SUPABASE_EVAL_ACCESS_TOKEN }}
          SUPABASE_EVAL_PROJECT_REF: ${{ vars.SUPABASE_EVAL_PROJECT_REF }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
          SUPABASE_EVAL_TEST_USER: ${{ vars.SUPABASE_EVAL_TEST_USER }}
          SUPABASE_EVAL_TEST_EMAIL: ${{ vars.SUPABASE_EVAL_TEST_EMAIL }}
        run: |
          set -euo pipefail
          export COMMIT_TIME="$(git show -s --format=%cI "$GITHUB_SHA")"
          node scripts/discovery-live-eval.mjs | tee /tmp/eval-results.md
      - name: Retain sanitized results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-eval-${{ github.sha }}
          path: /tmp/eval-results.md
          if-no-files-found: ignore
          retention-days: 7
