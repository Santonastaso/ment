name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.24.2 \
            git --redact --no-banner --verbose .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: build_only_placeholder

      - run: npm run check:i18n
      - run: npm run check:migrations
      - run: npm test

      - run: npm audit --prefix client --audit-level=high

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Replay migrations on a fresh local database
        run: supabase start -x studio,imgproxy,inbucket,logflare,vector,edge-runtime,supavisor
      - name: Validate database functions
        run: supabase db lint --local --fail-on error
      - name: Stop local services
        if: always()
        run: supabase stop --no-backup

  release-supabase:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gitleaks, build, database]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Check release credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MENT_EMP_EMAIL: ${{ secrets.MENT_EMP_EMAIL }}
          MENT_EMP_PASSWORD: ${{ secrets.MENT_EMP_PASSWORD }}
          MENT_ADMIN_EMAIL: ${{ secrets.MENT_ADMIN_EMAIL }}
          MENT_ADMIN_PASSWORD: ${{ secrets.MENT_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD \
            SUPABASE_URL SUPABASE_ANON_KEY MENT_EMP_EMAIL MENT_EMP_PASSWORD \
            MENT_ADMIN_EMAIL MENT_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing production secret: $name"
              exit 1
            fi
          done

      - name: Apply migrations and deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          project_ref=$(sed -n 's/^project_id = "\([^"]*\)"/\1/p' supabase/config.toml)
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$project_ref" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Set SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD; check project_id in supabase/config.toml."
            exit 1
          fi
          supabase link --project-ref "$project_ref"
          supabase db push --linked --dry-run
          supabase db push --linked --yes
          supabase db lint --linked --fail-on error
          supabase functions deploy --project-ref "$project_ref"

      - name: Verify production RLS policies
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MENT_EMP_EMAIL: ${{ secrets.MENT_EMP_EMAIL }}
          MENT_EMP_PASSWORD: ${{ secrets.MENT_EMP_PASSWORD }}
          MENT_ADMIN_EMAIL: ${{ secrets.MENT_ADMIN_EMAIL }}
          MENT_ADMIN_PASSWORD: ${{ secrets.MENT_ADMIN_PASSWORD }}
        run: python3 scripts/rls_smoke_test.py
