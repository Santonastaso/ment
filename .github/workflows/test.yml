name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A pull request keeps only its newest run. Each commit on main gets its own
# run: queued in one group, the middle of three quick merges was cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changed-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Detect changed Edge Functions
        id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo '::warning::No base revision available; function removal validation was skipped.'
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed_files=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          while IFS= read -r file; do
            [[ "$file" =~ ^supabase/functions/([^/]+)/ ]] || continue
            name="${BASH_REMATCH[1]}"
            [ "$name" = '_shared' ] && continue
            if [ ! -d "supabase/functions/$name" ]; then
              echo "::error::Function '$name' was removed. Delete it explicitly from Supabase before removing its source."
              exit 1
            fi
          done <<< "$changed_files"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Secret scan
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.24.2 \
            git --redact --no-banner --verbose .

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - run: npm ci

      - run: npm run check
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: build_only_placeholder

      - run: npm audit --prefix client --audit-level=high

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Verify user journeys with isolated fixtures
        run: npm run test:browser

      # Never upload raw browser output, screenshots, traces or reports.
      # The evidence job retains allowlisted results on success and failure.

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
      - name: Type-check Supabase Edge Functions
        run: |
          set -euo pipefail
          while IFS= read -r function; do
            deno check --node-modules-dir=auto --no-lock "$function"
          done < <(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -print | sort)
      - name: Parse a PDF in the Edge runtime
        run: deno test --node-modules-dir=auto --no-lock scripts/profile-pdf-runtime.test.mts

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v3
        with:
          version: 2.119.0
      - name: Replay migrations on a fresh local database
        run: supabase start -x studio,imgproxy,inbucket,logflare,vector,edge-runtime,supavisor
      - name: Validate database functions
        run: supabase db lint --local --fail-on error
      - name: Verify RLS against disposable local users
        run: |
          set -euo pipefail
          local_env="$(supabase status -o env)"
          export SUPABASE_URL="$(sed -n 's/^API_URL="\([^"]*\)"$/\1/p' <<< "$local_env")"
          export SUPABASE_ANON_KEY="$(sed -n 's/^ANON_KEY="\([^"]*\)"$/\1/p' <<< "$local_env")"
          export SUPABASE_SERVICE_ROLE_KEY="$(sed -n 's/^SERVICE_ROLE_KEY="\([^"]*\)"$/\1/p' <<< "$local_env")"
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY" && test -n "$SUPABASE_SERVICE_ROLE_KEY"
          export MENT_EMP_EMAIL='rls-employee@ment.local'
          export MENT_EMP_PASSWORD='local-employee-fixture-2026'
          export MENT_ADMIN_EMAIL='rls-admin@ment.local'
          export MENT_ADMIN_PASSWORD='local-admin-fixture-2026'
          export MENT_PEER_EMAIL='rls-peer@ment.local'
          export MENT_PEER_PASSWORD='local-peer-fixture-2026'
          python3 scripts/seed_local_rls.py
          python3 scripts/rls_smoke_test.py
          # Writes requests, so it runs here only, never in the production check below.
          python3 scripts/request_api_contract_test.py
      - name: Stop local services
        if: always()
        run: supabase stop --no-backup

  # Only the newest commit on main is released. An older commit released
  # after a newer one fails at "Apply migrations": production already holds a
  # migration that commit does not have. Its run ends green with the release
  # skipped, and the newest commit's run releases everything.
  newest-on-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [changed-functions, gitleaks, build, edge-functions, database]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      newest: ${{ steps.tip.outputs.newest }}
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo 'newest=true' >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has moved on to $tip; that commit's run does the release."
          fi

  release-supabase:
    if: needs.newest-on-main.outputs.newest == 'true'
    needs: newest-on-main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    outputs:
      database_lint: ${{ steps.production-lint.outcome }}
      rls: ${{ steps.production-rls.outcome }}
    # One release at a time, never interrupted.
    concurrency:
      group: release-supabase-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v3
        with:
          version: 2.119.0

      - name: Check release credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MENT_EMP_EMAIL: ${{ secrets.MENT_EMP_EMAIL }}
          MENT_EMP_PASSWORD: ${{ secrets.MENT_EMP_PASSWORD }}
          MENT_ADMIN_EMAIL: ${{ secrets.MENT_ADMIN_EMAIL }}
          MENT_ADMIN_PASSWORD: ${{ secrets.MENT_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD \
            SUPABASE_URL SUPABASE_ANON_KEY MENT_EMP_EMAIL MENT_EMP_PASSWORD \
            MENT_ADMIN_EMAIL MENT_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing production secret: $name"
              exit 1
            fi
          done
          project_ref=$(sed -n 's/^project_id = "\([^"]*\)"/\1/p' supabase/config.toml)
          target_host=$(python3 -c 'from urllib.parse import urlparse; import os; print(urlparse(os.environ["SUPABASE_URL"]).hostname or "")')
          if [ -z "$project_ref" ] || [ "$target_host" != "$project_ref.supabase.co" ]; then
            echo "::error::SUPABASE_URL does not match project_id in supabase/config.toml."
            exit 1
          fi

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          project_ref=$(sed -n 's/^project_id = "\([^"]*\)"/\1/p' supabase/config.toml)
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$project_ref" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Set SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD; check project_id in supabase/config.toml."
            exit 1
          fi
          supabase link --project-ref "$project_ref"
          supabase db push --linked --dry-run
          supabase db push --linked --yes

      - name: Sync auth redirect configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          project_ref=$(sed -n 's/^project_id = "\([^"]*\)"/\1/p' supabase/config.toml)
          supabase config diff --project-ref "$project_ref"
          supabase config push --project-ref "$project_ref" --yes

      - name: Deploy all Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          project_ref=$(sed -n 's/^project_id = "\([^"]*\)"/\1/p' supabase/config.toml)
          supabase link --project-ref "$project_ref"
          supabase functions deploy --project-ref "$project_ref"

      - name: Verify linked database
        id: production-lint
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          project_ref=$(sed -n 's/^project_id = "\([^"]*\)"/\1/p' supabase/config.toml)
          supabase link --project-ref "$project_ref"
          # Database diagnostics can contain schema/data details. Do not retain
          # raw output in Actions logs or artifacts, including on failure.
          diagnostic_file=$(mktemp)
          trap 'rm -f "$diagnostic_file"' EXIT
          if ! supabase db lint --linked --fail-on error >"$diagnostic_file" 2>&1; then
            echo '::error::Production database lint failed; inspect through restricted operator access.'
            exit 1
          fi
          echo 'Production database lint passed.'

      - name: Verify production RLS policies
        id: production-rls
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MENT_EMP_EMAIL: ${{ secrets.MENT_EMP_EMAIL }}
          MENT_EMP_PASSWORD: ${{ secrets.MENT_EMP_PASSWORD }}
          MENT_ADMIN_EMAIL: ${{ secrets.MENT_ADMIN_EMAIL }}
          MENT_ADMIN_PASSWORD: ${{ secrets.MENT_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          # This script may print response bodies. Never publish its raw output.
          diagnostic_file=$(mktemp)
          trap 'rm -f "$diagnostic_file"' EXIT
          if ! python3 scripts/rls_smoke_test.py >"$diagnostic_file" 2>&1; then
            echo '::error::Production RLS verification failed; inspect with dedicated test accounts through restricted operator access.'
            exit 1
          fi
          echo 'Production RLS verification passed.'

  verification-evidence:
    if: always()
    needs: [changed-functions, gitleaks, build, edge-functions, database, newest-on-main, release-supabase]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout, credentials, downloaded reports, member data or raw logs.
      - name: Summarize verification outcomes
        env:
          RESULTS: ${{ toJSON(needs) }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          results = json.loads(os.environ['RESULTS'])
          statuses = {'success', 'failure', 'cancelled', 'skipped'}
          def status(value):
              return value if value in statuses else 'unknown'
          def sha(value):
              if not re.fullmatch(r'[0-9a-f]{40}', value):
                  raise ValueError('Invalid commit identifier')
              return value
          scopes = {
              'changed-functions': 'function-removal-guard',
              'gitleaks': 'repository-secret-scan',
              'build': 'translations-migrations-unit-pglite-build-audit-fixture-browser',
              'edge-functions': 'edge-typecheck-and-pdf-runtime',
              'database': 'disposable-migration-replay-lint-rls-request-contract',
              'newest-on-main': 'release-freshness-gate',
              'release-supabase': 'production-release',
          }
          checks = {key: {'status': status(results.get(key, {}).get('result')), 'scope': scope}
                    for key, scope in scopes.items()}
          production = results.get('release-supabase', {}).get('outputs', {})
          # A skipped release is not successful production verification.
          for key in ('database_lint', 'rls'):
              checks['production-' + key] = {'status': status(production.get(key) or 'skipped'),
                                            'scope': 'production-dedicated-account-check'}
          required = ('changed-functions', 'gitleaks', 'build', 'edge-functions', 'database')
          evidence = {
              'schema_version': 1,
              'tested_sha': sha(os.environ['GITHUB_SHA']),
              'source_sha': sha(os.environ['SOURCE_SHA']),
              'event': os.environ['EVENT_NAME'],
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'run_url': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
              'ci_verification': 'success' if all(checks[k]['status'] == 'success' for k in required) else 'incomplete-or-failed',
              'checks': checks,
              'limitations': ['No legal approval or production acceptance implied',
                              'Browser uses isolated fixtures; database job uses disposable users',
                              'Job outcomes, not individual test counts; skipped is not passed'],
          }
          Path('verification-evidence').mkdir()
          Path('verification-evidence/summary.json').write_text(json.dumps(evidence, indent=2) + '\n')
          lines = ['## Privacy/security verification', '',
                   'Tested commit: `' + evidence['tested_sha'] + '`',
                   'Source commit: `' + evidence['source_sha'] + '`',
                   'CI verification: **' + evidence['ci_verification'] + '**', '',
                   '| Check | Outcome |', '| --- | --- |']
          lines += ['| ' + key + ' | ' + item['status'] + ' |' for key, item in checks.items()]
          lines += ['', 'No legal approval or production acceptance implied. No raw test output retained here.', '']
          summary = '\n'.join(lines)
          Path('verification-evidence/summary.md').write_text(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as target:
              target.write(summary)
          PY
      - name: Retain sanitized success and failure evidence
        uses: actions/upload-artifact@v4
        with:
          name: privacy-security-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-evidence/
          if-no-files-found: error
          retention-days: 30
