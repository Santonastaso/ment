name: discovery-dev

# Deploys a test copy of the discovery function as discovery-assistant-dev for
# local testing. Production users never call this copy; only a local build with
# VITE_DISCOVERY_FUNCTION set does. Trigger by pushing to dev/discovery.
# It deliberately runs no live eval: per docs/DISCOVERY_EVAL.md that runs only
# against the staging project and publishes no individual match details.
on:
  push:
    branches: [dev/discovery]

permissions:
  contents: read

concurrency:
  group: discovery-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Deploy test copy
        run: |
          cp -r supabase/functions/discovery-assistant supabase/functions/discovery-assistant-dev
          supabase functions deploy discovery-assistant-dev --project-ref "$SUPABASE_PROJECT_REF" --use-api
