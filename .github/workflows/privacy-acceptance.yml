name: Synthetic production privacy acceptance

on:
  workflow_dispatch:
    inputs:
      synthetic_fixtures_confirmation:
        description: 'Type CREATE_AND_DELETE_SYNTHETIC_FIXTURES_ONLY (creates disposable fixtures; never uses existing accounts)'
        required: true
        type: string

permissions:
  contents: read

# Serialize with Supabase releases; never cancel a run during fixture cleanup.
concurrency:
  group: release-supabase-production
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.ref == 'refs/heads/main' && inputs.synthetic_fixtures_confirmation == 'CREATE_AND_DELETE_SYNTHETIC_FIXTURES_ONLY'
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate Production acceptance credentials
        id: credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo '::error::Production privacy acceptance credentials are not configured.'
            exit 1
          fi
          if [ "$SUPABASE_ANON_KEY" = "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo '::error::Production privacy acceptance credentials are invalid.'
            exit 1
          fi
          case "$SUPABASE_URL" in https://*.supabase.co) ;; *) echo '::error::SUPABASE_URL must be an HTTPS Supabase project URL.'; exit 1;; esac
      - uses: actions/checkout@v5
        id: checkout
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install local test dependencies
        run: npm ci --ignore-scripts
      - name: Verify runner safety locally
        run: node --test scripts/privacy-acceptance.test.mjs
      - name: Run synthetic acceptance and guarded cleanup
        id: acceptance
        env:
          PRIVACY_ENVIRONMENT: production
          PRIVACY_SYNTHETIC_CONFIRMATION: ${{ inputs.synthetic_fixtures_confirmation }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/privacy-acceptance.mjs --execute > privacy-acceptance-report.json
      - name: Prepare sanitized acceptance artifact and job summary
        if: always() && steps.checkout.outcome == 'success'
        env:
          PRIVACY_EXECUTION_OUTCOME: ${{ steps.acceptance.outcome }}
        run: node scripts/privacy-acceptance.mjs --summarize
      - name: Prepare sanitized pre-checkout failure evidence
        if: always() && steps.checkout.outcome != 'success'
        env:
          PREFLIGHT_OUTCOME: ${{ steps.credentials.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const preflightFailed = process.env.PREFLIGHT_OUTCOME === 'failure';
          const report = {
            schema: 'ment-privacy-acceptance-1',
            provisional: true,
            retention_days: 30,
            run_id: process.env.GITHUB_RUN_ID,
            run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            commit: process.env.GITHUB_SHA,
            execution_outcome: 'failure',
            report_status: 'available',
            result: 'failed',
            passed: [],
            skipped: [],
            failed: 1,
            cleanup_errors: 0,
            failed_stage: preflightFailed ? 'preflight' : 'setup',
          };
          fs.mkdirSync('.privacy-acceptance', { recursive: true });
          fs.writeFileSync('.privacy-acceptance/acceptance.json', `${JSON.stringify(report, null, 2)}\n`, { mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '### Synthetic privacy acceptance (provisional)',
            '',
            `Result: failed; stage: ${report.failed_stage}.`,
            'No synthetic fixtures were created and no production acceptance checks ran.',
            '',
          ].join('\n'));
          NODE
      - name: Retain provisional sanitized acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: .privacy-acceptance/acceptance.json
          retention-days: 30
          if-no-files-found: error
