    <script>
      // Restore the SPA route preserved by 404.html (?p=/foo/bar) so React
      // Router sees the original URL on first load.
      (function () {
        var u = new URL(window.location.href);
        var p = u.searchParams.get('p');
        if (p) {
          u.searchParams.delete('p');
          var rest = u.search.replace(/^\?/, '');
          var base = u.pathname.replace(/\/$/, '');
          window.history.replaceState(null, '', base + p + (rest ? '?' + rest : '') + u.hash);
        }
      })();
    </script>
